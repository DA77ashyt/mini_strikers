<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Strikers 小程序 · 设计稿 v1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#0A1B33; --ink2:#1D2F4A; --muted:#7B8AA3; --faint:#A9B6C9;
    --blue:#1F6FEB; --blue-d:#0F4FC4; --blue-l:#E9F0FE; --blue-xl:#F3F7FF;
    --bg:#F4F7FC; --line:#E4EAF3; --white:#fff;
    --green:#0FA968; --amber:#F5A524; --red:#E5484D; --orange:#E8590C;
    --shadow:0 10px 30px rgba(10,27,51,.10);
  }
  body{
    background:
      radial-gradient(900px 500px at 15% -5%, #16305A 0%, transparent 60%),
      radial-gradient(700px 500px at 95% 10%, #102A4E 0%, transparent 55%),
      #0A1526;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    color:#fff; padding:48px; width:1285px; -webkit-font-smoothing:antialiased;
  }
  .board-head{height:64px; display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px;}
  .brand{font-size:26px; font-weight:800; letter-spacing:.14em;}
  .brand span{display:block; font-size:12px; font-weight:500; letter-spacing:.24em; color:#7FA6E0; margin-top:6px;}
  .meta{font-size:12px; color:#7FA6E0; letter-spacing:.06em; text-align:right; line-height:1.7;}

  .grid{display:grid; grid-template-columns:repeat(3,375px); gap:40px 32px;}
  figure{width:375px;}
  figcaption{height:36px; padding-top:12px; font-size:12px; color:#8CA6C9; letter-spacing:.08em; text-align:center;}

  /* ============ phone shell ============ */
  .phone{
    width:375px; height:812px; border-radius:38px; overflow:hidden; position:relative;
    background:#fff; box-shadow:0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  }
  .screen{height:100%; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);}
  .statusbar{height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:13px; font-weight:600; position:relative; z-index:5;}
  .sb-r{display:flex; gap:5px; align-items:center; font-size:10px; letter-spacing:-1px;}
  .navbar{height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:16px; font-weight:600;}
  .nav-side{width:44px; font-size:20px; color:var(--ink2); display:flex; align-items:center; gap:6px;}
  .nav-side.r{justify-content:flex-end;}
  .body{flex:1; overflow:hidden; position:relative;}
  .pad{padding:0 18px;}

  /* ============ atoms ============ */
  .muted{color:var(--muted);}
  .tiny{font-size:11px;}
  .sm{font-size:13px;}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;} .gap12{gap:12px;}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3C86FF,#1F5FD0);flex:0 0 auto;}
  .avatar.g2{background:linear-gradient(135deg,#6FA8FF,#2C6BE0);}
  .avatar.g3{background:linear-gradient(135deg,#9CC2FF,#4B7FE8);}
  .avatar.g4{background:linear-gradient(135deg,#2E5FA8,#0A2A5E);}
  .avatar.sm{width:32px;height:32px;font-size:12px;}
  .avatar.lg{width:56px;height:56px;font-size:19px;}
  .card{background:#fff; border-radius:16px; box-shadow:var(--shadow); border:1px solid rgba(228,234,243,.9);}
  .tag{display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:6px;
    font-size:11px; font-weight:600; letter-spacing:.02em;}
  .tag.blue{background:var(--blue-l); color:var(--blue-d);}
  .tag.green{background:#E7F7F0; color:#0B8A55;}
  .tag.amber{background:#FFF4E0; color:#B06F00;}
  .tag.red{background:#FEECEC; color:#C42929;}
  .tag.gray{background:#EEF1F6; color:#6B7A90;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}
  .btn{height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; letter-spacing:.04em;}
  .btn-primary{background:linear-gradient(135deg,#2C7BF5,#1557D6); color:#fff; box-shadow:0 8px 18px rgba(31,111,235,.30);}
  .btn-ghost{background:#fff; color:var(--blue); border:1.5px solid #C9DCFA;}
  .btn-dark{background:var(--ink); color:#fff;}
  .btn-sm{height:34px; border-radius:10px; padding:0 14px; font-size:13px; display:inline-flex; align-items:center; justify-content:center; font-weight:600;}
  .divider{height:1px; background:var(--line);}

  /* tab bar */
  .tabbar{height:76px; flex:0 0 76px; background:rgba(255,255,255,.97); border-top:1px solid var(--line);
    display:flex; padding-bottom:20px; backdrop-filter:blur(10px);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:10px; color:var(--faint); font-weight:500;}
  .tab.on{color:var(--blue); font-weight:700;}
  .tab svg{width:22px;height:22px;}

  /* ============ 1 首页 ============ */
  .hero{background:linear-gradient(155deg,#0B2344 0%,#123A76 55%,#1B54A8 100%); color:#fff;
    padding:0 20px 64px; position:relative; margin-top:-44px; padding-top:56px;}
  .hero::after{content:""; position:absolute; right:-40px; top:20px; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle,rgba(80,150,255,.35),transparent 65%);}
  .team-name{font-size:11px; letter-spacing:.34em; color:#9CC2FF; font-weight:600;}
  .greet{font-size:24px; font-weight:800; margin-top:6px; letter-spacing:.01em;}
  .greet-sub{font-size:12px; color:#A9C4EA; margin-top:6px;}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
  .next-card{margin:-46px 18px 0; padding:16px; position:relative; z-index:2;}
  .match-title{font-size:17px; font-weight:800; letter-spacing:.02em;}
  .match-meta{font-size:12px; color:var(--muted); margin-top:6px;}
  .progress{height:6px;border-radius:4px;background:#EDF2FA;overflow:hidden;margin-top:12px;}
  .progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2C7BF5,#5FA0FF);}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 18px 0;}
  .q{background:#fff;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;
    font-size:11px;color:var(--ink2);font-weight:600; box-shadow:0 6px 16px rgba(10,27,51,.06);}
  .q i{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--blue-l);color:var(--blue);}
  .q i svg{width:18px;height:18px;}
  .bday{margin:14px 18px 0;padding:12px 14px;display:flex;align-items:center;gap:12px;}
  .alert{margin:12px 18px 0;padding:11px 14px;border-radius:12px;background:#FFF7ED;border:1px solid #FFE0C2;
    display:flex;align-items:center;gap:10px;font-size:12px;color:#9A4A05;}
  .sec-title{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;}
  .sec-title b{font-size:14px;letter-spacing:.04em;}
  .notice{display:flex;gap:10px;align-items:center;padding:10px 18px;}
  .notice .bar{width:3px;height:30px;border-radius:2px;background:var(--blue);opacity:.8;}
  .notice .txt b{display:block;font-size:13px;font-weight:600;}
  .notice .txt span{font-size:11px;color:var(--faint);}

  /* ============ 2 赛程 ============ */
  .monthbar{display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 0 12px;font-size:16px;font-weight:700;}
  .monthbar span{color:var(--blue);font-size:18px;font-weight:400;}
  .cal{background:#fff;border-radius:16px;margin:0 18px;padding:12px 10px 6px;box-shadow:var(--shadow);}
  .cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;}
  .cal-head div{font-size:10px;color:var(--faint);padding:4px 0;font-weight:600;letter-spacing:.06em;}
  .cal-grid div{height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);position:relative;}
  .cal-grid .off{color:#C6D0DE;}
  .cal-grid .sel{background:var(--ink);color:#fff;border-radius:50%;width:34px;height:34px;margin:auto;font-weight:700;}
  .cal-grid .today{color:var(--blue);font-weight:800;}
  .cal-grid .has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
  .cal-grid .has.sel::after{background:#8CB9FF;}

  /* ============ 3 训练详情 ============ */
  .cover{height:194px;background:linear-gradient(135deg,#0C2A58 0%,#174E9E 60%,#2B72D8 100%);position:relative;padding:58px 18px 14px;color:#fff;margin-top:-44px;}
  .cover .ring{position:absolute;right:-30px;bottom:-50px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.07);}
  .cover .ring2{position:absolute;right:20px;bottom:-90px;width:160px;height:160px;border-radius:50%;border:18px solid rgba(255,255,255,.05);}
  .cover h1{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:8px;}
  .info-card{margin:-28px 18px 0;position:relative;padding:14px 16px;}
  .info-line{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;color:var(--ink2);}
  .info-line .k{width:18px;color:var(--blue);display:flex;}
  .info-line .v b{font-weight:600;}
  .stack{margin:12px 18px 0;padding:14px 16px;}
  .avatarwall{display:flex;align-items:center;margin-top:10px;gap:6px;}
  .avatarwall .avatar{width:30px;height:30px;font-size:11px;}
  .avatarwall .more{margin-left:4px;font-size:12px;color:var(--muted);}
  .bottom-bar{flex:0 0 82px;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;}

  /* ============ 4 接龙导入 ============ */
  .paste{margin:0 18px;background:#fff;border-radius:16px;border:1.5px dashed #B9D2F7;padding:12px 14px;font-size:12px;
    line-height:1.72;color:#41546F;font-family:ui-monospace,Menlo,Consolas,monospace;position:relative;overflow:hidden;height:128px;}
  .paste .dim{color:#A9B6C9;}
  .summary{display:flex;gap:8px;margin:12px 18px 0;}
  .sum{flex:1;background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line);}
  .sum b{font-size:18px;font-weight:800;letter-spacing:.02em;}
  .sum span{display:block;font-size:10px;color:var(--muted);margin-top:2px;}
  .imp-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;height:46px;padding:0 11px;
    margin:0 18px 6px;border:1px solid var(--line);}
  .imp-row.warn{border-color:#FAD9A6;background:#FFFBF3;}
  .imp-name{font-size:13px;font-weight:600;line-height:1.3;}
  .imp-src{font-size:10.5px;color:var(--faint);margin-top:1px;line-height:1.3;}
  .badge-ok{width:20px;height:20px;border-radius:50%;background:#E7F7F0;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;}

  /* ============ 5 点名台 ============ */
  .dark-head{background:linear-gradient(160deg,#071629,#0E2C55);color:#fff;padding:0 18px 14px;margin-top:-44px;padding-top:56px;}
  .dark-head h1{font-size:18px;font-weight:800;letter-spacing:.03em;}
  .dark-head .sub{font-size:11.5px;color:#8FB3E0;margin-top:4px;}
  .counts{display:flex;gap:6px;margin-top:12px;}
  .cnt{flex:1;background:rgba(255,255,255,.08);border-radius:10px;padding:7px 0;text-align:center;}
  .cnt b{font-size:16px;font-weight:800;display:block;}
  .cnt span{font-size:9.5px;color:#8FB3E0;letter-spacing:.06em;}
  .seg{display:flex;background:#E9EFF8;border-radius:10px;padding:3px;margin:12px 18px 0;}
  .seg div{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;color:#6B7A90;font-weight:600;}
  .seg div.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(10,27,51,.10);}
  .rc-row{display:flex;align-items:center;gap:11px;padding:9px 18px;border-bottom:1px solid #EEF2F8;}
  .rc-name{font-size:14px;font-weight:600;}
  .rc-meta{font-size:10.5px;color:var(--faint);margin-top:2px;}
  .states{display:flex;gap:5px;margin-left:auto;}
  .st{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;background:#F0F3F8;color:#A9B6C9;}
  .st.p{background:#E7F7F0;color:var(--green);box-shadow:inset 0 0 0 1.5px #B6E9D4;}
  .st.l{background:#FFF4E0;color:#B06F00;box-shadow:inset 0 0 0 1.5px #FAD9A6;}
  .st.a{background:#FEECEC;color:var(--red);box-shadow:inset 0 0 0 1.5px #F8C9C9;}

  /* ============ 6 比赛 ============ */
  .vs-cover{background:linear-gradient(135deg,#0A1F3D 0%,#143F7C 55%,#1E62C4 100%);color:#fff;padding:58px 18px 14px;margin-top:-44px;}
  .vs-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .vs-team{text-align:center;width:96px;}
  .vs-badge{width:54px;height:54px;border-radius:16px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);}
  .vs-team b{font-size:12px;font-weight:600;}
  .vs-mid{text-align:center;}
  .vs-mid b{font-size:26px;font-weight:800;letter-spacing:.06em;}
  .vs-mid span{display:block;font-size:10.5px;color:#9CC2FF;letter-spacing:.1em;margin-top:2px;}
  .gap-hint{background:linear-gradient(90deg,#EEF5FF,#F7FAFF);border-radius:12px;padding:10px 12px;font-size:12px;color:#1B4D8F;
    display:flex;gap:8px;align-items:center;border:1px solid #D8E7FF;}

  /* ============ 7 我的 ============ */
  .me-head{background:linear-gradient(160deg,#0B2344,#174B93);color:#fff;padding:16px 20px 46px;margin-top:-44px;padding-top:58px;}
  .me-name{font-size:21px;font-weight:800;}
  .me-meta{font-size:12px;color:#A9C4EA;margin-top:6px;}
  .num-badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:10px;
    padding:7px 12px;font-size:20px;font-weight:800;letter-spacing:.02em;}
  .stat-card{margin:-32px 18px 0;display:flex;padding:16px 0;position:relative;z-index:2;}
  .stat{flex:1;text-align:center;position:relative;}
  .stat+.stat::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line);}
  .stat b{font-size:22px;font-weight:800;letter-spacing:.01em;display:block;}
  .stat span{font-size:10.5px;color:var(--muted);}
  .list{margin:14px 18px 0;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);}
  .li{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #F0F3F8;font-size:14px;}
  .li:last-child{border-bottom:0;}
  .li i{width:30px;height:30px;border-radius:9px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
  .li i svg{width:16px;height:16px;}
  .li .chev{margin-left:auto;color:#C6D0DE;font-size:18px;}

  /* ============ 8 伤病 ============ */
  .inj-hero{background:linear-gradient(135deg,#3A1520 0%,#7A2033 60%,#B02A3D 100%);color:#fff;padding:16px;border-radius:16px;margin:0 18px;}
  .inj-hero .lbl{font-size:10.5px;letter-spacing:.18em;color:#F5B8C2;font-weight:600;}
  .inj-hero h2{font-size:20px;font-weight:800;margin-top:6px;}
  .inj-kv{display:flex;gap:10px;margin-top:14px;}
  .inj-kv div{flex:1;background:rgba(255,255,255,.10);border-radius:10px;padding:8px 10px;}
  .inj-kv span{display:block;font-size:9.5px;color:#F5B8C2;}
  .inj-kv b{font-size:12.5px;font-weight:600;}
  .tl{position:relative;padding-left:22px;}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line);}
  .tl-item{position:relative;padding:0 0 16px;}
  .tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--blue);}
  .tl-item.done::before{border-color:var(--green);}

  /* ============ 9 规范 ============ */
  .spec{background:#fff;height:100%;padding:16px 20px;overflow:hidden;}
  .spec h3{font-size:13px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:0 0 10px;}
  .sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .sw div{height:42px;border-radius:10px;display:flex;align-items:flex-end;padding:5px;font-size:8.5px;color:#fff;font-weight:600;}
  .sw div.light{color:#5A6B85;}
  .type-row{display:flex;align-items:baseline;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #EDF1F7;}
  .type-row span{font-size:10px;color:var(--faint);}
  .comp{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
</style>
</head>
<body>

<div class="board-head">
  <div class="brand">STRIKERS<span>球队助手 · 视觉设计稿 v1</span></div>
  <div class="meta">主色 蓝白 · 375 × 812<br>2026.11 · 8 个核心页面</div>
</div>

<main class="grid">

<!-- ================= 1 首页 ================= -->
<figure>
<div class="phone"><div class="screen">
  <div class="statusbar" style="color:#fff;"><span>9:41</span><span class="sb-r"><svg width="52" height="12" viewBox="0 0 52 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0.5" width="3" height="11.5" rx="1" fill="currentColor"/><rect x="25" y="2.6" width="13" height="6.8" rx="2" stroke="currentColor" stroke-width="1.1"/><rect x="27" y="4.3" width="8" height="3.4" rx="1" fill="currentColor"/><path d="M39.6 5.2v1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span></div>
  <div class="hero">
    <div class="row between">
      <div>
        <div class="team-name">STRIKERS</div>
        <div class="greet">周三好，阿伟</div>
      </div>
      <div class="row gap8">
        <div class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 3h16l-2-3z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></div>
        <div class="avatar sm">伟</div>
      </div>
    </div>
    <div class="greet-sub">共有 2 人今天过生日 · 本周 2 场活动</div>
  </div>

  <div class="next-card card">
    <div class="row between">
      <span class="tag blue">下一场 · 联赛</span>
      <span class="tiny" style="color:#E8590C;font-weight:600;">还有 2 天</span>
    </div>
    <div class="match-title" style="margin-top:10px;">Strikers vs 闪电队</div>
    <div class="match-meta">11月8日 周六 14:00 · 城南体育公园</div>
    <div class="row between" style="margin-top:14px;">
      <div class="tiny muted">已报名 <b style="color:var(--ink);font-size:12.5px;">18</b> / 22 人</div>
      <div class="tiny" style="color:var(--blue);font-weight:600;">去报名 ›</div>
    </div>
    <div class="progress"><i style="width:82%"></i></div>
  </div>

  <div class="alert">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#C2570A" stroke-width="2" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.2"/></svg>
    <div style="flex:1"><b>你当前处于伤停中</b> · 右膝 · 预计 11-20 复出</div>
    <span style="color:#C9A26B;">›</span>
  </div>

  <div class="quick">
    <div class="q"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg></i>报名</div>
